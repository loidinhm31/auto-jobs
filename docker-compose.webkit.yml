services:
  webkit:
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    init: true
    ipc: host
    working_dir: /workspace
    volumes:
      - .:/workspace
      - webkit_node_modules:/workspace/node_modules
    environment:
      PLAYWRIGHT_BROWSER: webkit
      PLAYWRIGHT_HTML_OPEN: never
      NODE_DISABLE_COMPILE_CACHE: "1"
    command:
      - sh
      - -eu
      - -c
      - npm ci --ignore-scripts && npm run test:release

volumes:
  webkit_node_modules:
